name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Pas encore de package-lock.json : npm résout les versions
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Vérifie que le paquet compilé se charge dans Node.js (imports avec extension .js)
      - run: node -e "import('./dist/index.js').then((m) => { if (!m.createApiClient) process.exit(1) })"
